version: "4.8.1"
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: comic_user
      POSTGRES_PASSWORD: comic_pass
      POSTGRES_DB: comic_scanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  client:
    container_name: client
    restart: always
    build: ./client
    ports:
      - "3000:3000"
    links:
      - "app"
  app:
    container_name: app
    restart: always
    build: ./api
    env_file: ./.env
    ports:
      - "4000:4000"
    depends_on:
      - postgres
volumes:
  pgdata:
